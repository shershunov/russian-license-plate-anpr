<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Номера</title>
    <link href="/static/style.css" rel="stylesheet">
    <link href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff6363'/><rect x='6' y='12' width='20' height='9' rx='2' fill='%23fff'/></svg>"
          rel="icon">
</head>
<body>

<div class="shell">
    <header class="bar">
    <span class="brand">
      <svg class="brand-mark" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
           stroke-width="1.8" viewBox="0 0 24 24">
        <rect height="10" rx="2" width="20" x="2" y="7"/><path d="M6 11v2M10 11v2M14 11v2M18 11v2"/>
      </svg>
      Номера
    </span>

        <span class="crumb" hidden id="crumb">
      <span class="slash">/</span>
      <span class="crumb-name" id="crumbName"></span>
      <span class="crumb-extra" id="crumbExtra"></span>
    </span>

        <div class="bar-tail">
      <span class="loading" hidden id="loading">
        <svg class="spin" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24"><path
                d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Загрузка
      </span>
            <button aria-label="Выгрузить CSV" class="btn icon" hidden id="csvBtn" title="Выгрузить CSV">
                <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                     viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                </svg>
            </button>
            <button aria-label="Новые кадры" class="btn icon" hidden id="clearBtn" title="Новые кадры">
                <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
            <button aria-label="Переключить тему" class="btn icon" id="themeBtn" title="Тема">
                <svg class="ico-sun" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
                </svg>
                <svg class="ico-moon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="2" viewBox="0 0 24 24">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="progress" hidden id="progress">
        <div class="track">
            <div class="fill" id="progressFill"></div>
        </div>
        <span class="ratio" id="progressText"></span>
    </div>

    <main class="main" id="main">
        <div class="landing" id="landing">
            <button class="drop" id="drop" type="button">
        <span class="drop-icon">
          <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
               viewBox="0 0 24 24">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M3.5 15v2.5A2.5 2.5 0 0 0 6 20h12a2.5 2.5 0 0 0 2.5-2.5V15"/>
          </svg>
        </span>
                <span class="drop-text">
          <b id="dropTitle">Перетащите фото</b>
          <span>нажмите, чтобы выбрать — можно пачкой</span>
          <span class="drop-paste">
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                 viewBox="0 0 24 24">
              <rect height="4" rx="1" width="8" x="8" y="2"/><path
                    d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            </svg>
            или вставьте скриншот <kbd>Ctrl+V</kbd>
          </span>
        </span>
                <span class="drop-formats">PNG · JPG · WEBP · BMP · TIFF</span>
            </button>
        </div>

        <nav aria-label="Кадры" class="strip" hidden id="strip"></nav>

        <section class="scan" hidden id="scan">
            <div class="tools">
                <button aria-label="Разметка" class="btn icon" id="boxesBtn" title="Разметка">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
                <button aria-label="Отдалить" class="btn icon" id="zoomOut" title="Отдалить">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M5 12h14"/>
                    </svg>
                </button>
                <button aria-label="Вписать" class="btn icon" id="zoomFit" title="Вписать">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>
                    </svg>
                </button>
                <button aria-label="Приблизить" class="btn icon" id="zoomIn" title="Приблизить">
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5v14"/>
                    </svg>
                </button>
            </div>

            <div class="scroller" id="scroller">
                <div class="zoombox" id="zoombox">
                    <div class="plate-stage" id="stage">
                        <img alt="" decoding="async" id="frame">
                    </div>
                </div>
            </div>

            <div class="scan-foot">
                <span id="scanState"></span>
                <span id="zoomValue"></span>
            </div>
        </section>

        <div aria-orientation="vertical" class="splitter" hidden id="splitter" role="separator"></div>

        <section class="pane" hidden id="pane"></section>
    </main>
</div>

<input accept="image/*" hidden id="picker" multiple type="file">
<div aria-hidden="true" class="veil" id="veil"><span>Отпустите</span></div>
<div class="notes" id="notes"></div>

<script src="/static/app.js"></script>
</body>
</html>
